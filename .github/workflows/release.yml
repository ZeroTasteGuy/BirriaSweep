name: Build package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      page_ref:
        description: BrowSDR_Sweep branch or tag for the bundled page
        default: main
      release_tag:
        description: Publish the ZIP as a release with this tag, e.g. v0.1.0 (empty = artifact only)
        default: ''

permissions:
  contents: write   # to publish releases on v* tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        shell: pwsh
        run: ./scripts/build_windows.ps1 -PageRef '${{ github.event.inputs.page_ref || 'main' }}'
      - name: Smoke test the package
        shell: pwsh
        run: |
          Expand-Archive dist/BirriaSweep-windows-x64.zip smoke
          smoke/BirriaSweep/python/python.exe -c "import numpy, ctypes; print('numpy', numpy.__version__)"
          smoke/BirriaSweep/python/python.exe smoke/BirriaSweep/bridge/birria_bridge.py --help
      - uses: actions/upload-artifact@v4
        with:
          name: BirriaSweep-windows-x64
          path: dist/BirriaSweep-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/BirriaSweep-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev python3-numpy
      - run: scripts/build_linux.sh --no-page
      - name: Smoke test the bridge with a fake stick
        run: |
          python3 -m py_compile bridge/birria_bridge.py
          timeout 5 python3 build/BirriaSweep/bridge/birria_bridge.py --fake --no-browser || test $? = 124
